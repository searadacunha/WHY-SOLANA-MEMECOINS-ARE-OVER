name: Solana forensics v2 regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forensic-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned forensic test requirements
        run: python -m pip install -r forensics_v2/requirements.txt
      - name: Recheck source and store/trace invariants
        run: python -m pytest -q forensics_v2/tests
      - name: Check public source for credentials
        run: python code/check_no_secrets.py --require-clean
